# Build Klipper for STM32G0B1 (32KiB bootloader).

# See docs/Config_Reference.md for a description of parameters.

# This file edited by ECL 01-06-25

#Include Files
[include mainsail.cfg]
[include macros/*.cfg]
#[include adxl345.cfg]
#[include timelapse.cfg]

#####################################################################
# 	XYZ Steppers
#####################################################################

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^PC0
position_min: 0
position_endstop: 291
position_max: 291
homing_speed: 50
homing_retract_dist: 5.0
homing_retract_speed: 30
second_homing_speed: 15

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.9
stealthchop_threshold: 0

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
rotation_distance: 64
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^PC1
position_min: -8
position_endstop: 280
position_max: 280
homing_speed: 50
homing_retract_dist: 5.0
homing_retract_speed: 30
second_homing_speed: 15

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 1.1
stealthchop_threshold: 0

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
rotation_distance: 8
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 305
homing_speed: 8
homing_retract_dist: 3.0
homing_retract_speed: 5.0
second_homing_speed: 2.0

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.780
stealthchop_threshold: 0

#####################################################################
# 	Bed Probing
#####################################################################

[probe]
pin: ^PC14
x_offset: 21
y_offset: 7.2
speed: 5

[safe_z_home]
home_xy_position: 124.5, 132.8
speed: 100
z_hop: 5
z_hop_speed: 5

[bed_mesh]
speed: 100
mesh_min: 43, 5
mesh_max: 291, 280
algorithm: bicubic
probe_count: 7, 7

#####################################################################
# 	Extruder
#####################################################################

[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD1
rotation_distance: 21.5450
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 50:17
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
min_temp: 1
max_temp: 300
max_power: 1.0
min_extrude_temp: 160
control: pid
pid_kp = 26.452
pid_ki = 1.346
pid_kd = 129.943
pressure_advance: 0.01
max_extrude_only_distance: 100.0

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.580
stealthchop_threshold: 0

[firmware_retraction]
retract_length: 0.9
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 30

#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_kp=29.287
pid_ki=0.233
pid_kd=919.255
min_temp: 0
max_temp: 130
max_power: 1.0

#####################################################################
# 	Neopixel LEDs
#####################################################################

[neopixel toolhead_led]
pin: PA8
chain_count: 8
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

#####################################################################
# 	Fan Controls
#####################################################################

#Hotend Fan
[heater_fan extruder_fan]
pin: PC7
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

#Controller Fan
[heater_fan controller_fan]
pin: PB15

##Part Cooling Fan
[fan]
pin: PC6
max_power: 0.5
cycle_time: .08
kick_start_time: .25
##	Depending on your fan, you may need to increase this value
##	if your fan will not start. Can change cycle_time (increase)
##	if your fan is not able to slow down effectively

#####################################################################
# 	MCU
#####################################################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_390019001150415833323520-if00

#[mcu rpi]
#serial: /tmp/klipper_host_mcu

#[adxl345]
#cs_pin: rpi:None

#[resonance_tester]
#accel_chip: adxl345
#probe_points:
#    145, 140, 20  # an example

[input_shaper]
shaper_type_x = mzv
shaper_freq_x = 63.0
shaper_type_y = mzv
shaper_freq_y = 38.6

#####################################################################
# 	Printer Definitions
#####################################################################

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3500
square_corner_velocity: 5
max_z_velocity: 12
max_z_accel: 100

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

# Enable object exclusion
[exclude_object]

[gcode_arcs]
resolution: 1.0

[idle_timeout]
timeout: 600

#####################################################################
# 	AI Modules
#####################################################################

[ai_backend]
provider: claude
api_key: YOUR_ANTHROPIC_API_KEY_HERE
model: claude-sonnet-4-20250514
timeout: 30.0
rate_limit_rpm: 20

[ai_config_assistant]

# Camera - uses your existing /dev/video0 from crowsnest
# NOTE: crowsnest uses ustreamer which holds /dev/video0 exclusively.
# ai_camera captures via snapshot URL instead. See capture_command below.
[ai_camera]
camera_device: /dev/video0
capture_command: wget
snapshot_url: http://localhost:8080/?action=snapshot
resolution: 640x480
capture_dir: /tmp/ai_camera
check_interval: 60.0
failure_action: pause
confidence_threshold: 0.7
enable_first_layer_check: True
first_layer_check_delay: 120.0

[ai_calibration_wizard]

[ai_print_tests]

[ai_mesh_analysis]

[ai_filament_profiles]
profiles_file: ~/printer_data/config/filament_profiles.json

[ai_print_history]
history_file: ~/printer_data/config/print_history.json
max_entries: 500
auto_log: True

[ai_resonance]
csv_dir: /tmp

[ai_timelapse]
frames_dir: /tmp/timelapse
max_frames_to_analyze: 20

[ai_notifications]
#telegram_bot_token:
#telegram_chat_id:
#discord_webhook_url:
notify_on_failure: True
notify_on_completion: True
include_snapshot: True

[ai_print_recovery]
enabled: True
max_retries: 2
purge_amount: 30.0
z_hop: 5.0

