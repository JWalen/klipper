#####################################################################
# 	LED Control
#####################################################################

[gcode_macro LED_ON]
description: Turn on toolhead LEDs (white 80%)
gcode:
    SET_LED LED=toolhead_led RED=0.8 GREEN=0.8 BLUE=0.8

[gcode_macro LED_OFF]
description: Turn off toolhead LEDs
gcode:
    SET_LED LED=toolhead_led RED=0.0 GREEN=0.0 BLUE=0.0

[gcode_macro LED_PRINTING]
description: Warm white for print illumination
gcode:
    SET_LED LED=toolhead_led RED=1.0 GREEN=0.85 BLUE=0.6

[gcode_macro LED_HEATING]
description: Orange while heating
gcode:
    SET_LED LED=toolhead_led RED=1.0 GREEN=0.35 BLUE=0.0

[gcode_macro LED_SUCCESS]
description: Green on print complete
gcode:
    SET_LED LED=toolhead_led RED=0.0 GREEN=1.0 BLUE=0.0

[gcode_macro LED_ERROR]
description: Red on failure
gcode:
    SET_LED LED=toolhead_led RED=1.0 GREEN=0.0 BLUE=0.0

[gcode_macro LED_COLOR]
description: Set custom LED color (R/G/B 0.0-1.0)
gcode:
    {% set R = params.R|default(0.0)|float %}
    {% set G = params.G|default(0.0)|float %}
    {% set B = params.B|default(0.0)|float %}
    SET_LED LED=toolhead_led RED={R} GREEN={G} BLUE={B}
