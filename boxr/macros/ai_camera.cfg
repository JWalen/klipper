#####################################################################
# 	AI Camera & Config Macros
#####################################################################

[gcode_macro AI_CHECK_CONFIG]
description: AI analyzes your printer configuration
gcode:
    AI_CONFIG_CHECK

[gcode_macro AI_CHECK_PRINT]
description: AI checks current print with camera
gcode:
    AI_CAMERA_CHECK TYPE=failure

[gcode_macro AI_CHECK_FIRST_LAYER]
description: AI checks first layer quality
gcode:
    AI_CAMERA_CHECK TYPE=first_layer

[gcode_macro AI_START_WATCHING]
description: Start AI camera monitoring during print
gcode:
    AI_CAMERA_WATCH INTERVAL=60

[gcode_macro AI_STOP_WATCHING]
description: Stop AI camera monitoring
gcode:
    AI_CAMERA_STOP
