#####################################################################
# 	AI Analysis & History Macros
#####################################################################

[gcode_macro AI_ANALYZE_MESH]
description: AI analyzes bed mesh probe data
gcode:
    AI_MESH_ANALYZE

[gcode_macro AI_LIST_FILAMENTS]
description: List all saved filament profiles
gcode:
    AI_FILAMENT_LIST

[gcode_macro AI_SUGGEST_FILAMENT]
description: AI suggests settings for a filament type
gcode:
    {% set TYPE = params.TYPE|default("PLA") %}
    AI_FILAMENT_SUGGEST TYPE={TYPE}

[gcode_macro AI_SHOW_HISTORY]
description: Show recent print and calibration history
gcode:
    AI_HISTORY_SHOW COUNT=10

[gcode_macro AI_CHECK_TRENDS]
description: AI analyzes calibration trends
gcode:
    AI_HISTORY_TREND

[gcode_macro AI_RESONANCE_CHECK]
description: Run resonance test with AI analysis
gcode:
    {% set AXIS = params.AXIS|default("x") %}
    AI_RESONANCE_TEST AXIS={AXIS}

[gcode_macro AI_CHECK_BELTS]
description: AI checks belt tension via resonance
gcode:
    AI_BELT_CHECK

[gcode_macro AI_ANALYZE_TIMELAPSE]
description: AI analyzes timelapse frames for issues
gcode:
    AI_TIMELAPSE_ANALYZE
