#####################################################################
# 	Macros
#####################################################################


    
[gcode_macro M0]
gcode:
  PAUSE

[gcode_macro ParkBed]
gcode:
  # Move bed to 1mm off ZMax
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  G90
  G1 Z{max_z - 5} F1500
  G91

[gcode_macro M84]
rename_existing: M84.1
gcode:
#   I changed M84 behavior so the z motors do not disable so bed does not fall
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
  SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
  SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
  SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1 ; disable all motors but Z

[gcode_macro CG28]
gcode:
    {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}
    G28
    {% endif %}

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    CG28                      ; Home if not homed to get everything turned on

[gcode_macro M600]
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91
    G1 E-.8 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state

[gcode_macro SET_RETRACTIONLENGTH]
gcode:
  SET_RETRACTION RETRACT_LENGTH={params.LENGTH|float}
  GET_RETRACTION
  
[gcode_macro PRIME_LINE]
gcode: 
    M117 Prime Line
	#Get Printer built volume dimensions
    {% set X_MAX = printer.toolhead.axis_maximum.x|default(100)|float %}
    {% set Y_MAX = printer.toolhead.axis_maximum.y|default(100)|float %}
    {% set Z_MAX = printer.toolhead.axis_maximum.z|default(100)|float %}

    #Get Nozzle diameter and filament width for conditioning
    {% set NOZZLE = printer.extruder.nozzle_diameter|default(0.4)|float %}
    {% set FILADIA = printer.extruder.filament_diameter|default(1.75)|float %}

    #Set Start coordinates of priming lines
    {% set X_START = 20|default(3.0)|float %}
    {% set Y_START = 3.0|default(3.0)|float %}

    #Set End coordinates of priming lines
    {% set X_END = X_MAX - 20|default(378)|float %}
    
    #Calculate Primer line extrusion volume and filament length
    {% set PRIMER_WIDTH = 0.75 * NOZZLE %}                    
    {% set PRIMER_HEIGHT = 0.70 * NOZZLE %}           
    {% set PRIMER_SECT = PRIMER_WIDTH * PRIMER_HEIGHT %}    
    {% set PRIMER_VOL = PRIMER_SECT * (X_END - X_START) %}    
    {% set FILA_SECT = 3.1415 * ( FILADIA / 2.0)**2 %}          
    {% set FILA_LENGTH = 1.55 * PRIMER_VOL / FILA_SECT %}                           

    #Move bed up to
    G1 Z{Z_MAX/10.0} F320                            

    #Prime extruder with a prime line across front of print bed
    G92 E0 ; zero out extruder     
    G1 X{X_START} Y{Y_START} Z{PRIMER_HEIGHT} F6000.0 ; Go to start X_Start Y_START position in front left     
    G1 X{X_END} Y{Y_START} E{FILA_LENGTH} Z{PRIMER_HEIGHT} F2000.0 ; Go right to X_END posistion extruding FILA_LENGTH
    G1 Y{Y_START + PRIMER_WIDTH} F2000.0 ; Move Y forward by Prime Width
    G1 X{X_START} Y{Y_START + PRIMER_WIDTH} E{FILA_LENGTH * 2} Z{PRIMER_HEIGHT} F2000.0 ; Go back left to X_START posistion extruding FILA_LENGTH 
    G92 E0 ; zero out extruder again            
    G1 Z2.0 F600 ; move up 2mm to help break off filament       
    G1 Z0.2 F600 ; move move back down to 0.2mm to stick ooze back to prime line        
    G1 Z2.0 F600 ; move up 2mm again to help break off filament 

[gcode_macro START_PRINT]
gcode:
    G21 ; metric values
    G90 ; absolute positioning
    M82 ; set extruder to absolute mode

    {% set BED_TEMP = params.BED_TEMP|default(70)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    M140 S{BED_TEMP} ; start heating bed
    M104 S175 ; preheat extruder a little
    M190 S{BED_TEMP} ; wait for bed
    M107 ; fan off

    BED_MESH_CLEAR
    G28
    BED_MESH_CALIBRATE

    M109 S{EXTRUDER_TEMP} ; wait for full hotend temp

    PRIME_LINE
    ; prime and wipe sequence
    #G92 E0
    #G1 E4 F300
    #G92 E0
    #G1 X260 Y280 Z0.3 F600
    #G1 X240 E3 F1800
    #G4 S1
    #G1 X230 F250
    #G92 E0
    #G1 Z0.3 F600

[gcode_macro END_PRINT]
gcode:
 # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-2.0 F3600                 ; retract filament
    
    TURN_OFF_HEATERS
    #SET_FAN_SPEED FAN=RSCS SPEED=0.0           ; turn of RSCS fans
    #SET_FAN_SPEED FAN=chamber_fan SPEED=0.0    ; turn of the chamber cooling fan
    
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x - 2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
	M84 ; steppers off
    SET_PRESSURE_ADVANCE ADVANCE=0  ; Reset Pressure Advance to Zero
    
    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END

[gcode_macro LOAD_FILAMENT]
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity %}
    G91
    G92 E0
    G1 E75 F{max_velocity}
    G1 E35 F{speed} #purge

[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity %}
    G91
    G92 E0
    G1 E8 F{speed} # purge
    G1 E-100 F{max_velocity}

[gcode_macro CALIBRATE_PROBE_OFFSET]
gcode:
    G28
    PROBE_CALIBRATE
    SAVE_CONFIG

[gcode_macro CALIBRATE_BED_MESH]
description: Run full bed mesh calibration
gcode:
    BED_MESH_CLEAR
    G28
    BED_MESH_CALIBRATE
    SAVE_CONFIG

#####################################################################
# 	AI Macros
#####################################################################

[gcode_macro AI_CHECK_CONFIG]
description: AI analyzes your printer configuration
gcode:
    AI_CONFIG_CHECK

[gcode_macro AI_CHECK_PRINT]
description: AI checks current print with camera
gcode:
    AI_CAMERA_CHECK TYPE=failure

[gcode_macro AI_CHECK_FIRST_LAYER]
description: AI checks first layer quality
gcode:
    AI_CAMERA_CHECK TYPE=first_layer

[gcode_macro AI_START_WATCHING]
description: Start AI camera monitoring during print
gcode:
    AI_CAMERA_WATCH INTERVAL=60

[gcode_macro AI_STOP_WATCHING]
description: Stop AI camera monitoring
gcode:
    AI_CAMERA_STOP

[gcode_macro AI_FULL_CALIBRATION]
description: Start AI-guided full printer calibration
gcode:
    AI_CALIBRATE_START

[gcode_macro AI_FIRST_LAYER_TEST]
description: Print first layer calibration test with AI analysis
gcode:
    AI_TEST_FIRST_LAYER ANALYZE=1

[gcode_macro AI_FLOW_TEST]
description: Print flow/extrusion calibration test with AI analysis
gcode:
    AI_TEST_FLOW ANALYZE=1

[gcode_macro AI_PA_TEST]
description: Print pressure advance calibration test with AI analysis
gcode:
    AI_TEST_PA ANALYZE=1

[gcode_macro AI_SPEED_TEST]
description: Print speed calibration test with AI analysis
gcode:
    AI_TEST_SPEED ANALYZE=1

[gcode_macro AI_TEMP_TOWER]
description: Print temperature tower with AI analysis
gcode:
    AI_TEST_TEMP ANALYZE=1

[gcode_macro AI_RETRACTION_TEST]
description: Print retraction test with AI analysis
gcode:
    AI_TEST_RETRACTION ANALYZE=1

[gcode_macro AI_BRIDGING_TEST]
description: Print bridging test with AI analysis
gcode:
    AI_TEST_BRIDGING ANALYZE=1

[gcode_macro AI_OVERHANG_TEST]
description: Print overhang test with AI analysis
gcode:
    AI_TEST_OVERHANG ANALYZE=1

[gcode_macro AI_ANALYZE_MESH]
description: AI analyzes bed mesh probe data
gcode:
    AI_MESH_ANALYZE

[gcode_macro AI_LIST_FILAMENTS]
description: List all saved filament profiles
gcode:
    AI_FILAMENT_LIST

[gcode_macro AI_SUGGEST_FILAMENT]
description: AI suggests settings for a filament type
gcode:
    {% set TYPE = params.TYPE|default("PLA") %}
    AI_FILAMENT_SUGGEST TYPE={TYPE}

[gcode_macro AI_SHOW_HISTORY]
description: Show recent print and calibration history
gcode:
    AI_HISTORY_SHOW COUNT=10

[gcode_macro AI_CHECK_TRENDS]
description: AI analyzes calibration trends
gcode:
    AI_HISTORY_TREND

[gcode_macro AI_RESONANCE_CHECK]
description: Run resonance test with AI analysis
gcode:
    {% set AXIS = params.AXIS|default("x") %}
    AI_RESONANCE_TEST AXIS={AXIS}

[gcode_macro AI_CHECK_BELTS]
description: AI checks belt tension via resonance
gcode:
    AI_BELT_CHECK

[gcode_macro AI_ANALYZE_TIMELAPSE]
description: AI analyzes timelapse frames for issues
gcode:
    AI_TIMELAPSE_ANALYZE

[gcode_macro AI_TEST_NOTIFICATION]
description: Send a test notification
gcode:
    AI_NOTIFY_TEST

[gcode_macro AI_RECOVER_PRINT]
description: Attempt AI-guided print recovery
gcode:
    AI_RECOVER

[gcode_macro AI_RECOVERY_ON]
description: Enable automatic AI print recovery
gcode:
    AI_RECOVERY_ENABLE

[gcode_macro AI_RECOVERY_OFF]
description: Disable automatic AI print recovery
gcode:
    AI_RECOVERY_DISABLE
